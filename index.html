<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Pro Calligraphy Studio</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="workspace">
<div id="canvasContainer">
<canvas id="gridCanvas"></canvas>
<canvas id="templateCanvas"></canvas>
<canvas id="drawingCanvas"></canvas>
<canvas id="heatmapCanvas"></canvas>
</div>
</div>
<div id="topBar">
<button id="menuBtn">☰ الأدوات والخطوط</button>
<div class="compass" id="compass">زاوية القلم: <span id="angleDisplay">45°</span></div>
<div class="brush-settings">
<input type="color" id="colorPicker" value="#000000" title="لون الحبر" />
<label>حجم السن:</label>
<input type="range" id="brushSize" min="5" max="60" value="20" />
</div>
<div class="actions">
<button id="clearBtn" class="danger">مسح</button>
<button id="scoreBtn" class="primary" title="التطابق الحراري">خريطة التطابق</button>
</div>
</div>
<div id="scorePopup" class="hidden">
<h3>دقة المحاكاة: <span id="scoreValue">0</span>%</h3>
<p id="scoreMessage"></p>
<button id="closeScoreBtn">إغلاق</button>
</div>
<div id="drawer" class="drawer">
<div class="drawer-header">
<h2>المرسم الرقمي</h2>
<button id="closeDrawerBtn">✕</button>
</div>
<div class="drawer-content">
<div class="input-group">
<label>النص للتدريب:</label>
<input type="text" id="practiceText" value="بسم الله الرحمن الرحيم" />
</div>
<div class="input-group">
<label>شفافية النموذج (Ghost Mode):</label>
<input type="range" id="ghostOpacity" min="0" max="100" value="40" />
</div>
<div class="input-group">
<label>إظهار شبكة التسطير:</label>
<select id="gridSelect">
<option value="none">بدون تسطير</option>
<option value="ruqaa" selected>مائل (رقعة/ديواني)</option>
<option value="naskh">أفقي (نسخ/ثلث)</option>
<option value="english">إنجليزي (Slant 55°)</option>
</select>
</div>
<hr>
<h3>أنواع الخطوط:</h3>
<button class="template-btn active" data-font="Aref Ruqaa" data-lang="ar" data-angle="-45" data-flex="false">خط الرقعة (سن 45°)</button>
<button class="template-btn" data-font="Amiri" data-lang="ar" data-angle="-70" data-flex="false">خط النسخ (سن 70°)</button>
<button class="template-btn" data-font="Reem Kufi" data-lang="ar" data-angle="0" data-flex="false">الخط الكوفي (سن مستقيم)</button>
<button class="template-btn" data-font="Dancing Script" data-lang="en" data-angle="0" data-flex="true">English Cursive (ريشة مرنة)</button>
</div>
</div>
<script type="module" src="main.js"></script>
</body>
</html>
